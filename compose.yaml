services:
  monitor:
    build: .
    image: gimb-discord-monitor
    env_file: .env
    volumes:
      - data:/app/data
    restart: unless-stopped
    labels:
      # Built locally, not pulled from a registry; update with git pull + build.
      com.centurylinklabs.watchtower.enable: "false"
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

volumes:
  data:

[project]
name = "gimb-discord-monitor"
version = "0.1.0"
description = "Daily Gimnazija Bežigrad intranet alerts for Discord"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.13,<5",
  "filelock>=3.16,<4",
  "python-dotenv>=1.1,<2",
  "requests>=2.32.4,<3",
  "tzdata>=2025.2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
